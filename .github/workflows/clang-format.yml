name: clang-format

on:
  pull_request:
    # Keep in sync with SOURCE_SUFFIXES in scripts/check_clang_format.py.
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cxx'
      - '**/*.h'
      - '**/*.hh'
      - '**/*.hpp'
      - '**/*.hxx'
      - '.clang-format'
      - '.clang-format-ignore'
      - 'scripts/check_clang_format.py'
      - '.github/workflows/clang-format.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format
      - name: Check changed C/C++ files
        run: python3 scripts/check_clang_format.py --changed
