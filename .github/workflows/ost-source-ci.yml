    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Hosted runner billing notice
        if: ${{ matrix.hosted }}
        shell: bash
        run: echo "::notice title=OpenStrata hosted-runner usage::This job uses GitHub-hosted infrastructure. Private repositories may incur GitHub Actions usage charges. Review repository billing and Actions usage settings."
      - name: Bootstrap ost 0.22.10 (pinned release asset, checksum-verified)
        if: ${{ matrix.hosted }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   triple=x86_64-unknown-linux-musl ; ext=tar.xz ;;
            macOS-ARM64) triple=aarch64-apple-darwin ; ext=tar.xz ;;
            macOS-X64)   triple=x86_64-apple-darwin ; ext=tar.xz ;;
            Windows-X64) triple=x86_64-pc-windows-msvc ; ext=zip ;;
            *) echo "::error title=ost bootstrap::no ost release asset for ${RUNNER_OS}-${RUNNER_ARCH}" ; exit 1 ;;
          esac
          pinned=""
          case "$triple" in
            *) : ;;
          esac
          asset="ost-cli-${triple}.${ext}"
          base="https://github.com/animu-sphere/open-strata/releases/download/v0.22.10"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo "$asset.sha256" "$base/$asset.sha256"
          actual="$( (command -v sha256sum > /dev/null && sha256sum "$asset" || shasum -a 256 "$asset") | cut -d' ' -f1 )"
          published="$(cut -d' ' -f1 "$asset.sha256")"
          if [ "$actual" != "$published" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the release publishes $published" ; exit 1
          fi
          if [ -n "$pinned" ] && [ "$actual" != "$pinned" ]; then
            echo "::error title=ost bootstrap::$asset hashes to $actual but the CI contract pins $pinned" ; exit 1
          fi
          mkdir -p .ost-ci/bootstrap-bin
          if [ "$ext" = "zip" ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$asset' -DestinationPath '.ost-ci/bootstrap-bin' -Force"
          else
            tar -xf "$asset" -C .ost-ci/bootstrap-bin
          fi
          bin="$(find .ost-ci/bootstrap-bin -type f \( -name ost -o -name ost.exe \) | head -n 1)"
          if [ -z "$bin" ]; then echo "::error title=ost bootstrap::no ost binary inside $asset" ; exit 1 ; fi
          chmod +x "$bin" 2> /dev/null || true
          bin_dir="$(cd "$(dirname "$bin")" && pwd)"
          bin="$bin_dir/$(basename "$bin")"
          executable="$bin"
          exported_path="$bin_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            if ! command -v cygpath > /dev/null; then
              echo "::error title=ost bootstrap::cygpath is required to export a native Windows PATH" ; exit 1
            fi
            executable="$(cygpath -w "$bin")"
            exported_path="$(cygpath -w "$bin_dir")"
          fi
          echo "$exported_path" >> "$GITHUB_PATH"
          json_executable="$(printf '%s' "$executable" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          json_exported_path="$(printf '%s' "$exported_path" | sed 's/\\/\\\\/g; s/"/\\"/g')"
          printf '{"schema":1,"pinned_version":"%s","asset":"%s","sha256":"%s","executable":"%s","exported_path":"%s"}\n' "0.22.10" "$asset" "$actual" "$json_executable" "$json_exported_path" > .ost-ci/bootstrap.json
      - name: Check ost is available and record its version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          if [ "${{ matrix.hosted }}" = "true" ] && [ "$RUNNER_OS" = "Windows" ]; then
            version="$(powershell -NoProfile -Command "& ost.exe --version" | tr -d '\r')"
          else
            version="$(ost --version)"
          fi

          echo "$version"
          if [ "${{ matrix.hosted }}" = "true" ] && [ "$version" != "ost 0.22.10" ]; then
            echo "::error title=ost bootstrap::expected 'ost 0.22.10', got '$version'" ; exit 1
          fi
          printf '{"schema":1,"ost_version":"%s"}\n' "$version" > .ost-ci/ost-version.json
      - name: Validate the CI manifest
        shell: bash
        run: ost ci validate
      - name: Restore the artifact registry cache (speed only, never correctness)
        id: runtime-cache-restore
        if: ${{ matrix.hosted && vars.OST_CI_DISABLE_CACHE != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.22.10-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.runtime_artifact }}
      - name: Pull the pinned runtime SDK from its remote reference
        if: ${{ matrix.runtime_remote != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          openusd_args=()
          if [ -n "${{ matrix.require_openusd }}" ]; then
            openusd_args+=(--require-openusd "${{ matrix.require_openusd }}")
          fi
          if [ -n "${{ matrix.require_openusd_version }}" ]; then
            openusd_args+=(--require-openusd-version "${{ matrix.require_openusd_version }}")
          fi
          if ost artifact show "${{ matrix.runtime_artifact }}" --json > /dev/null 2>&1 \
             && ost artifact verify "${{ matrix.runtime_artifact }}" ${{ matrix.evidence_flags }} "${openusd_args[@]}" --json > .ost-ci/runtime-cache-verify.json; then
            echo "pinned runtime already present and verified (cache hit) -- skipping the remote pull"
          else
            if [ "${{ matrix.hosted }}" = "true" ] && [ -n "${OST_HOME:-}" ]; then
              rm -rf "${OST_HOME}/artifacts"
            fi
            ost artifact pull "${{ matrix.runtime_remote }}" --expect-artifact "${{ matrix.runtime_artifact }}" --require-kind runtime "${openusd_args[@]}" --json | tee .ost-ci/runtime-pull.json
          fi
      - name: Verify and materialize the pinned runtime SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          printf '{"schema":1,"runtime_artifact":"%s","require_openusd":"%s","require_openusd_version":"%s","source":"%s"}\n' "${{ matrix.runtime_artifact }}" "${{ matrix.require_openusd }}" "${{ matrix.require_openusd_version }}" "${{ matrix.runtime_remote != '' && 'remote-pull' || 'local-registry' }}" > .ost-ci/runtime-source.json
          openusd_args=()
          if [ -n "${{ matrix.require_openusd }}" ]; then
            openusd_args+=(--require-openusd "${{ matrix.require_openusd }}")
          fi
          if [ -n "${{ matrix.require_openusd_version }}" ]; then
            openusd_args+=(--require-openusd-version "${{ matrix.require_openusd_version }}")
          fi
          ost artifact verify ${{ matrix.runtime_artifact }} --minimum-trust ${{ matrix.minimum_trust }} ${{ matrix.evidence_flags }} "${openusd_args[@]}"
          ost runtime pull ${{ matrix.platform }} --profile ${{ matrix.profile }} --from-artifact ${{ matrix.runtime_artifact }} --force
      - name: Remove resumable transfer state before caching
        if: ${{ matrix.hosted && vars.OST_CI_DISABLE_CACHE != 'true' && steps.runtime-cache-restore.outputs.cache-hit != 'true' }}
        shell: bash
        run: rm -rf .ost-ci-home/artifacts/.partial-blobs
      - name: Save the verified artifact registry cache
        if: ${{ matrix.hosted && vars.OST_CI_DISABLE_CACHE != 'true' && steps.runtime-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ost-ci-home/artifacts
          key: ost-registry-0.22.10-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ matrix.runtime_artifact }}
      - name: Install the host packages this runtime needs to be consumed
        if: ${{ matrix.host_packages_apt != '' || matrix.host_packages_brew != '' }}
        shell: bash
        env:
          HOST_PACKAGES_APT: ${{ matrix.host_packages_apt }}
          HOST_PACKAGES_BREW: ${{ matrix.host_packages_brew }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              packages="$HOST_PACKAGES_APT"
              if [ -z "$packages" ]; then
                echo "error: this cell declares host_packages but nothing under 'apt'; a Linux runner installs from the 'apt' list" >&2
                exit 1
              fi
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends $packages
              ;;
            macOS)
              packages="$HOST_PACKAGES_BREW"
              if [ -z "$packages" ]; then
                echo "error: this cell declares host_packages but nothing under 'brew'; a macOS runner installs from the 'brew' list" >&2
                exit 1
              fi
              brew install $packages
              ;;
            *)
              echo "error: host_packages has no installer for $RUNNER_OS; provision the dependency on the runner image instead" >&2
              exit 1
              ;;
          esac
      - name: Set up host Python for schema tooling
        if: ${{ matrix.hosted && matrix.host_python != '' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.host_python }}
      - name: Record the schema-tooling Python contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          if [ "${{ matrix.hosted }}" = "true" ] && [ -n "${{ matrix.host_python }}" ]; then
            source=host-setup-python
          elif [ -n "${{ matrix.host_python }}" ]; then
            source=operator-provisioned
          else
            source=runtime-bundled
          fi
          printf '{"schema":1,"host_python":"%s","source":"%s"}\n' "${{ matrix.host_python }}" "$source" > .ost-ci/python-setup.json
      - name: Validate the materialized runtime (runnable tools)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ost-ci
          ost runtime validate ${{ matrix.platform }} --profile ${{ matrix.profile }} --json | tee .ost-ci/runtime-validate.json
      - name: Build the plugin from source
        shell: bash
        run: ost plugin build ${{ matrix.bundle }} --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
      - name: Run the verification pyramid
        shell: bash
        run: ost plugin test ${{ matrix.bundle }} --target ${{ matrix.platform }} --profile ${{ matrix.profile }} --up-to ${{ matrix.up_to }} --json
      - name: Package the plugin (never published from this workflow)
        shell: bash
        run: ost plugin package ${{ matrix.bundle }} --target ${{ matrix.platform }} --profile ${{ matrix.profile }}
      - name: Upload the verification report and CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: report-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/.strata/reports/
            .ost-ci/
