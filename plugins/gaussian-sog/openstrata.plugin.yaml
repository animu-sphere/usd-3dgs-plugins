# OpenStrata plugin bundle manifest.
# A plugin is a self-describing bundle, not a bare shared library: this file is
# the contract `ost plugin inspect|build|doctor|test` resolve against.
#
# gaussian-sog reads PlayCanvas SOG v2 in both layouts: the bundled `.sog` ZIP
# archive and the unbundled `meta.json` with its companion WebP property
# planes. Both converge on one container reader, one semantic decoder, and the
# shared Gaussian layer writer, so the authored stage matches PLY and SPZ by
# construction.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: gaussian-sog
  version: 0.5.0
  kind: usd-fileformat
# SPDX license for this plugin's own code. Surfaced by `ost plugin inspect` and
# recorded in the package manifest.
license: Apache-2.0
notices:
  - THIRD_PARTY_NOTICES.md
runtime:
  # The OpenUSD version range this plugin tolerates. The runtime supplies the
  # certified point within it.
  # ParticleField3DGaussianSplat is part of OpenUSD 26.05's usdVol schema.
  openusd: ">=26.05,<27.0"
  # Source bundles do not hard-code C++ ABI; `ost plugin doctor` compares the
  # resolved target/runtime ABI when a built or packaged manifest records one.
  cxx_abi: inherit
provides:
  - usd-fileformat:sog
requires:
  capabilities: [usd-stage-read]
  libraries:
    - id: gaussianCore
      version: ">=0.1,<0.2"
    - id: gaussianUsd
      version: ">=0.3,<0.4"
usd:
  # Where this bundle's plugInfo.json lives, relative to the bundle root.
  plug_info: plugin/resources/gaussian-sog/plugInfo.json
tests:
  # Only bundled `.sog` fixtures are declared here: they are self-contained
  # single files, so they behave identically from the source tree and from a
  # package. The unbundled layout needs `meta.json` *plus* its companion planes
  # and is covered by the C++ reader/decoder tests and the Python smoke test,
  # which read the fixture directory in place.
  smoke:
    - tests/fixtures/kit-one-degree0.sog
    - tests/fixtures/kit-multi-degree3.sog
    - tests/fixtures/kit-multi-degree3-deflated.sog
    - tests/fixtures/decode-degree1.sog
  roundtrip:
    - tests/fixtures/decode-degree1.sog
  negative:
    - tests/fixtures/not-sog.sog
    - tests/fixtures/no-meta.sog
    - tests/fixtures/bad-zip.sog
    - tests/fixtures/malformed-meta.sog
    - tests/fixtures/version-1.sog
    - tests/fixtures/version-3.sog
    - tests/fixtures/empty-count.sog
    - tests/fixtures/count-exceeds-plane.sog
    - tests/fixtures/bad-bands.sog
    - tests/fixtures/short-codebook.sog
    - tests/fixtures/escaping-plane-name.sog
    - tests/fixtures/missing-plane.sog
    - tests/fixtures/lossy-plane.sog
    - tests/fixtures/corrupt-plane.sog
    - tests/fixtures/bad-quat-tag.sog
