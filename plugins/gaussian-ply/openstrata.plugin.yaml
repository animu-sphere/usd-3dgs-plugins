# OpenStrata plugin bundle manifest.
# A plugin is a self-describing bundle, not a bare shared library: this file is
# the contract `ost plugin inspect|build|doctor|test` resolve against.
manifest:
  schema: openstrata.plugin/v1alpha1
plugin:
  name: gaussian-ply
  version: 0.13.0
  kind: usd-fileformat
# SPDX license for this plugin's own code. Surfaced by `ost plugin inspect` and
# recorded in the package manifest. Change it to match your project's license.
license: Apache-2.0
notices:
  - THIRD_PARTY_NOTICES.md
runtime:
  # The OpenUSD version range this plugin tolerates. The runtime supplies the
  # certified point within it.
  # ParticleField3DGaussianSplat is part of OpenUSD 26.05's usdVol schema.
  openusd: ">=26.05,<27.0"
  # Source bundles do not hard-code C++ ABI; `ost plugin doctor` compares the
  # resolved target/runtime ABI when a built or packaged manifest records one.
  # To pin it, `cxx_abi` accepts a scalar (`msvc143`), the `inherit` sentinel
  # (defer to the runtime), or a per-OS map for a cross-platform bundle:
  #   cxx_abi: { windows: msvc143, linux: libstdcxx, macos: libcxx }
  cxx_abi: inherit
provides:
  - usd-fileformat:ply
requires:
  capabilities: [usd-stage-read]
  libraries:
    - id: gaussianCore
      version: ">=0.1,<0.2"
    - id: gaussianUsd
      version: ">=0.3,<0.4"
usd:
  # Where this bundle's plugInfo.json lives, relative to the bundle root.
  plug_info: plugin/resources/gaussian-ply/plugInfo.json
tests:
  smoke:
    - tests/fixtures/one-gaussian-ascii.ply
    - tests/fixtures/one-gaussian-binary-le.ply
    - tests/fixtures/degree-1-sh.ply
    - tests/fixtures/degree-2-sh.ply
    - tests/fixtures/degree-3-sh.ply
    - tests/fixtures/reordered-properties.ply
    - tests/fixtures/three-gaussian-binary-le.ply
    # SuperSplat compressed PLY routes through the same bundle by header
    # signature (docs/reference/COMPRESSED_PLY_MAPPING.md).
    - tests/fixtures/compressed-sh1.ply
    - tests/fixtures/compressed-reordered.ply
    - tests/fixtures/compressed-two-chunks.ply
    - tests/fixtures/compressed-render-mode-mip.ply
  roundtrip:
    - tests/fixtures/one-gaussian-ascii.ply
    - tests/fixtures/compressed-sh1.ply
  negative:
    - tests/fixtures/mesh-not-gaussian.ply
    - tests/fixtures/missing-opacity.ply
    - tests/fixtures/truncated-binary-le.ply
    - tests/fixtures/out-of-range-double.ply
    - tests/fixtures/empty-vertex.ply
    - tests/fixtures/list-property.ply
    - tests/fixtures/invalid-sh-name.ply
    - tests/fixtures/duplicate-sh-index.ply
    - tests/fixtures/non-contiguous-sh.ply
    - tests/fixtures/sh-count-not-rgb.ply
    - tests/fixtures/sh-invalid-degree.ply
    - tests/fixtures/degree-4-sh.ply
    - tests/fixtures/nan-opacity-binary-le.ply
    - tests/fixtures/overflow-scale.ply
    - tests/fixtures/compressed-ascii.ply
    - tests/fixtures/compressed-big-endian.ply
    - tests/fixtures/compressed-colourless-chunk.ply
    - tests/fixtures/compressed-float-packed.ply
    - tests/fixtures/compressed-extra-vertex-property.ply
    - tests/fixtures/compressed-extra-element.ply
    - tests/fixtures/compressed-missing-chunk.ply
    - tests/fixtures/compressed-chunk-count.ply
    - tests/fixtures/compressed-sh-rows.ply
    - tests/fixtures/compressed-sh-not-rgb.ply
    - tests/fixtures/compressed-sh-degree-4.ply
    - tests/fixtures/compressed-sh-bad-name.ply
    - tests/fixtures/compressed-empty.ply
    - tests/fixtures/compressed-too-many-gaussians.ply
    - tests/fixtures/compressed-nan-bound.ply
    - tests/fixtures/compressed-inverted-bound.ply
    - tests/fixtures/compressed-scale-overflow.ply
    - tests/fixtures/compressed-truncated.ply
